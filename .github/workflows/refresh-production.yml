name: Refresh Athena Production

on:
  workflow_dispatch:
  schedule:
    # 05:15 Puerto Rico (AST, UTC-4) every day.
    - cron: "15 9 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: athena-production-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Rebuild Puerto Rico snapshot and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATHENA_DEFAULT_CATALOG_PATH: data/catalog.csv
      ATHENA_REPORT_SNAPSHOT_PATH: data/observatory_report.json
      ATHENA_CATALOG_FRESHNESS_HOURS: "72"
      ATHENA_RESEARCH_BUNDLE_PATH: data/global_research/global-m6-1976-2025
      ATHENA_RESEARCH_RELEASE_TAG: research-global-m6-1976-2025-v2
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-east1' }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'project-athena-api' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for this repository."
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Athena API and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Stage Athena region configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          import src

          source = Path("config/regions.json")
          target = Path(src.__file__).resolve().parent.parent / "config" / "regions.json"
          if not source.is_file():
              raise SystemExit(f"Repository region configuration is missing: {source}")

          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          if not target.is_file():
              raise SystemExit(f"Athena region configuration was not staged: {target}")

          print(f"Staged Athena region configuration: {target}")
          PY

      - name: Stage durable global research bundle
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_BASE="https://github.com/DataScienceConsultants/project-athena/releases/download/${ATHENA_RESEARCH_RELEASE_TAG}"
          ARCHIVE="athena-global-m6-1976-2025.zip"
          CHECKSUM="${ARCHIVE}.sha256"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --fail --location --retry 4 --retry-all-errors \
            --output "$TMP_DIR/$ARCHIVE" \
            "$RELEASE_BASE/$ARCHIVE"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$TMP_DIR/$CHECKSUM" \
            "$RELEASE_BASE/$CHECKSUM"

          (
            cd "$TMP_DIR"
            sha256sum --check "$CHECKSUM"
          )

          rm -rf "$ATHENA_RESEARCH_BUNDLE_PATH"
          mkdir -p "$(dirname "$ATHENA_RESEARCH_BUNDLE_PATH")"
          unzip -q "$TMP_DIR/$ARCHIVE" -d "$(dirname "$ATHENA_RESEARCH_BUNDLE_PATH")"

          test -f "$ATHENA_RESEARCH_BUNDLE_PATH/metadata.json"
          test -f "$ATHENA_RESEARCH_BUNDLE_PATH/catalog.csv"
          test -f "$ATHENA_RESEARCH_BUNDLE_PATH/fault_associations.csv"
          test -f "$ATHENA_RESEARCH_BUNDLE_PATH/faults.geojson"
          test -f "$ATHENA_RESEARCH_BUNDLE_PATH/event_plate_context.csv"
          test -f "$ATHENA_RESEARCH_BUNDLE_PATH/plate_boundaries.geojson"

      - name: Validate global research bundle
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          bundle = Path(os.environ["ATHENA_RESEARCH_BUNDLE_PATH"])
          metadata = json.loads((bundle / "metadata.json").read_text(encoding="utf-8"))

          expected = {
              "bundle_schema_version": 2,
              "profile_id": "global-m6-1976-2025",
              "start_utc": "1976-01-01T00:00:00Z",
              "end_utc": "2026-01-01T00:00:00Z",
              "minimum_magnitude": 6.0,
              "research_mode": "retrospective_global",
              "report_is_nonpredictive": True,
              "fault_context_included": True,
              "fault_geojson_included": True,
              "plate_boundary_context_included": True,
              "plate_boundary_geojson_included": True,
              "plate_boundary_step_count": 5819,
              "plate_boundary_geojson_feature_count": 5819,
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(
                      f"Unexpected research metadata {key}: "
                      f"{metadata.get(key)!r}; expected {value!r}"
                  )

          with (bundle / "catalog.csv").open(
              "r", encoding="utf-8", newline=""
          ) as source:
              catalog_count = sum(1 for _ in csv.DictReader(source))
          if catalog_count != metadata.get("catalog_event_count"):
              raise SystemExit("Research catalog row count does not match metadata")

          faults = json.loads((bundle / "faults.geojson").read_text(encoding="utf-8"))
          if faults.get("type") != "FeatureCollection":
              raise SystemExit("Research faults.geojson is not a FeatureCollection")
          if len(faults.get("features", [])) != metadata.get("fault_geojson_feature_count"):
              raise SystemExit("Research fault feature count does not match metadata")

          boundaries = json.loads(
              (bundle / "plate_boundaries.geojson").read_text(encoding="utf-8")
          )
          if boundaries.get("type") != "FeatureCollection":
              raise SystemExit("Research plate_boundaries.geojson is not a FeatureCollection")
          if len(boundaries.get("features", [])) != 5819:
              raise SystemExit("Research PB2002 boundary-step count is invalid")

          with (bundle / "event_plate_context.csv").open(
              "r", encoding="utf-8", newline=""
          ) as source:
              plate_connection_count = sum(1 for _ in csv.DictReader(source))
          if plate_connection_count != metadata.get(
              "event_plate_boundary_association_count"
          ):
              raise SystemExit("Research plate-connection row count does not match metadata")
          if plate_connection_count <= 0:
              raise SystemExit("Research event-to-plate-boundary context is empty")

          citations = {
              item.get("source_key"): item
              for item in metadata.get("source_citations", [])
              if isinstance(item, dict)
          }
          bird = citations.get("bird_pb2002") or {}
          if (bird.get("citation") or {}).get("doi") != "10.1029/2001GC000252":
              raise SystemExit("Bird PB2002 DOI citation is missing or incorrect")
          if bird.get("distribution_license") != "ODC-By-1.0":
              raise SystemExit("PB2002 distribution-license provenance is missing")
          if bird.get("distribution_commit") != (
              "339b0c56563c118307b1f4542703047f5f698fae"
          ):
              raise SystemExit("PB2002 pinned distribution commit is missing")
          if bird.get("observed_git_blob_sha") != (
              "b48506d79c614b241ce26cf949492ee7c6676d60"
          ):
              raise SystemExit("PB2002 pinned source blob SHA is missing")

          print(
              "Validated durable research bundle v2: "
              f"events={catalog_count}, "
              f"fault_features={metadata.get('fault_geojson_feature_count')}, "
              f"plate_steps={metadata.get('plate_boundary_step_count')}, "
              f"plate_connections={plate_connection_count}, "
              "mode=retrospective/nonpredictive"
          )
          PY

      - name: Build fresh Puerto Rico catalog and Observatory snapshot
        run: python -m app.bootstrap_catalog

      - name: Validate anomaly score before deployment
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          from app.services.athena import AthenaService

          catalog = Path("data/catalog.csv")
          snapshot = Path("data/observatory_report.json")
          if not catalog.is_file() or not snapshot.is_file():
              raise SystemExit("Production catalog/snapshot was not generated")

          report = AthenaService().build_report().to_dict()
          analytical_snapshot = report.get("snapshot") or {}
          latest_anomaly = analytical_snapshot.get("latest_anomaly") or {}
          score = latest_anomaly.get("score")
          if (
              isinstance(score, bool)
              or not isinstance(score, (int, float))
              or not math.isfinite(float(score))
          ):
              raise SystemExit(
                  "Fresh Observatory snapshot does not contain a finite latest anomaly score"
              )

          payload = json.loads(snapshot.read_text(encoding="utf-8"))
          metadata = payload.get("metadata") or {}
          print(
              "Validated production snapshot: "
              f"score={float(score):.1f}, "
              f"events={metadata.get('source_event_count')}, "
              f"catalog_as_of={metadata.get('catalog_as_of_utc')}, "
              f"generated_at={metadata.get('generated_at_utc')}"
          )
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy refreshed source to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.GCP_CLOUD_RUN_SERVICE }}
          source: .

      - name: Verify deployed Observatory and research APIs
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python - <<'PY'
          import math
          import os
          import time

          import requests

          base_url = os.environ["DEPLOYED_URL"].rstrip("/")
          last_error = None
          for attempt in range(1, 7):
              try:
                  response = requests.get(f"{base_url}/summary", timeout=20)
                  response.raise_for_status()
                  payload = response.json()
                  score = payload.get("latest_anomaly_score")
                  if (
                      isinstance(score, bool)
                      or not isinstance(score, (int, float))
                      or not math.isfinite(float(score))
                  ):
                      raise RuntimeError(
                          f"latest_anomaly_score is not finite: {score!r}"
                      )

                  research_response = requests.get(
                      f"{base_url}/research/global/summary", timeout=20
                  )
                  research_response.raise_for_status()
                  research = research_response.json()
                  availability = research.get("availability") or {}
                  if research.get("report_is_nonpredictive") is not True:
                      raise RuntimeError("Research summary lost nonpredictive marker")
                  if research.get("bundle_schema_version") != 2:
                      raise RuntimeError("Research API is not serving bundle schema v2")
                  for key in (
                      "catalog",
                      "fault_associations",
                      "fault_geometry",
                      "plate_boundaries",
                      "plate_connections",
                  ):
                      if availability.get(key) is not True:
                          raise RuntimeError(
                              f"Research artifact is unavailable after deploy: {key}"
                          )
                  if not isinstance(research.get("catalog_event_count"), int) or research[
                      "catalog_event_count"
                  ] <= 0:
                      raise RuntimeError("Research catalog event count is invalid")
                  if research.get("plate_boundary_step_count") != 5819:
                      raise RuntimeError("Research PB2002 boundary-step count is invalid")
                  if not isinstance(
                      research.get("event_plate_boundary_association_count"), int
                  ) or research["event_plate_boundary_association_count"] <= 0:
                      raise RuntimeError("Research plate-connection count is invalid")

                  boundary_response = requests.get(
                      f"{base_url}/research/plate-boundaries", timeout=20
                  )
                  boundary_response.raise_for_status()
                  boundaries = boundary_response.json()
                  if boundaries.get("available") is not True:
                      raise RuntimeError("Plate-boundary geometry endpoint is unavailable")
                  if len(boundaries.get("features", [])) != 5819:
                      raise RuntimeError("Plate-boundary geometry endpoint count is invalid")

                  connections_response = requests.get(
                      f"{base_url}/research/plate-connections", timeout=20
                  )
                  connections_response.raise_for_status()
                  plate_connections = connections_response.json()
                  if plate_connections.get("available") is not True:
                      raise RuntimeError("Plate-connection endpoint is unavailable")
                  if len(plate_connections.get("items", [])) != research.get(
                      "event_plate_boundary_association_count"
                  ):
                      raise RuntimeError("Plate-connection endpoint count is invalid")

                  print(
                      "Production verification passed: "
                      f"latest_anomaly_score={float(score):.1f}, "
                      f"catalog_as_of={payload.get('catalog_as_of_utc')}, "
                      f"research_events={research.get('catalog_event_count')}, "
                      f"plate_steps={research.get('plate_boundary_step_count')}, "
                      f"plate_connections={research.get('event_plate_boundary_association_count')}"
                  )
                  break
              except Exception as exc:  # deployment may need a few seconds to settle
                  last_error = exc
                  if attempt == 6:
                      raise
                  time.sleep(10)
          else:
              raise RuntimeError(str(last_error))
          PY
